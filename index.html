<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17171c" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="NoteSeen" />
    <meta
      name="description"
      content="NoteSeen is a fast notes app by Arigato Labs. Sign in, type, close — already saved."
    />
    <title>NoteSeen</title>
    <style>
      #ns-boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #ffffff;
        color: #212121;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        transition: opacity 220ms ease, visibility 220ms ease;
      }
      html.dark #ns-boot {
        background: #0d0d11;
        color: #f2f2f4;
      }
      #ns-boot img {
        width: 56px;
        height: 56px;
        border-radius: 12px;
      }
      #ns-boot span {
        font-size: 15px;
        letter-spacing: -0.02em;
        font-weight: 600;
      }
      #ns-boot.ns-boot-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
    </style>
    <script>
      try {
        var stored = localStorage.getItem("noteseen.appearance");
        var dark =
          stored === "dark" ||
          (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body class="h-full">
    <div id="ns-boot" aria-hidden="true">
      <img src="/android-chrome-192x192.png" alt="" width="56" height="56" />
      <span>NoteSeen</span>
    </div>
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
